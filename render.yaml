services:
  - type: web
    name: rera-hub
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "20"
    routes:
      - type: rewrite
        source: /Robots.txt
        destination: /robots.txt
      - type: rewrite
        source: /*
        destination: /index.html
